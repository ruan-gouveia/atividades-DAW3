<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atividades DAW III</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #006633;
      color: white;
      padding: 20px 30px;
    }

    header h1 { font-size: 24px; letter-spacing: 2px; }
    header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 20px;
    }

    h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    a {
      display: block;
      background: white;
      border-top: 4px solid #006633;
      border-radius: 8px;
      padding: 30px 40px;
      text-align: center;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      width: 240px;
    }

    a:hover { transform: translateY(-4px); }

    a span {
      display: block;
      font-size: 36px;
      margin-bottom: 12px;
    }

    a h3 {
      color: #006633;
      font-size: 15px;
      margin-bottom: 6px;
    }

    a p { font-size: 13px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>IFPB</h1>
    <p>Desenvolvimento de Aplicações Web III</p>
  </header>

  <main>
    <h2>Selecione uma atividade</h2>
    <div class="cards">
      <a href="https://cadastro-disciplinas.vercel.app">
        <span>📋</span>
        <h3>Atividade 1</h3>
        <p>Cadastro de Disciplinas</p>
      </a>
      <a href="https://paginas-professores.vercel.app">
        <span>👨‍🏫</span>
        <h3>Atividade 2</h3>
        <p>Páginas de Professores</p>
      </a>
    </div>
  </main>
</body>
</html>
